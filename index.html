<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Grid</title>
<style>
  :root { --bg: #101a33; --ink: #f3f1ff; --dim: #9aa6cf; --panel: #18264d; --gold: #ffc94d; --good: #43d18b; --bad: #ff5d6c; --warn: #f6a64a; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
  body { color: var(--ink); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none;
         background: radial-gradient(900px 600px at 30% -10%, #2a3f7a, transparent 70%), var(--bg); }
  [hidden] { display: none !important; }
  #app { height: 100%; height: 100dvh; box-sizing: border-box; max-width: 1100px; margin: 0 auto; display: grid; gap: 8px 18px;
         grid-template-columns: minmax(0, 1fr) minmax(220px, 290px); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "head head" "play side" "net net";
         padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  header { grid-area: head; display: flex; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 21px; letter-spacing: .02em; }
  header h1 b { color: var(--gold); }
  #score { font-weight: 800; color: var(--dim); }
  #clock { margin-left: auto; font: 900 26px/1 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; padding: 6px 12px; border-radius: 12px; background: #ffffff10; }
  #clock.low { color: #fff; background: var(--bad); }
  #play { grid-area: play; position: relative; min-height: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #side { grid-area: side; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  #players { display: flex; flex-direction: column; gap: 6px; }
  .pl { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; background: var(--panel); border-radius: 12px; padding: 7px 11px; border: 2px solid transparent; }
  .pl i { width: 10px; height: 10px; border-radius: 50%; grid-row: 1 / 3; }
  .pl b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .pl span { font: 900 18px ui-monospace, Menlo, Consolas, monospace; grid-row: 1 / 3; grid-column: 3; }
  .pl small { color: var(--dim); font-size: 12px; }
  .pl.me { border-color: var(--gold); }
  .pl.up span { animation: pop .5s ease-out; color: var(--gold); transform-origin: left center; }
  @keyframes pop { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }
  #words { flex: 1; min-height: 0; overflow: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; }
  #words .wh { width: 100%; font-size: 12px; font-weight: 800; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .chip { background: #ffffff14; border-radius: 8px; padding: 3px 8px; font-weight: 800; letter-spacing: .05em; font-size: 14px; }
  .chip b { color: var(--gold); font-size: 11px; margin-left: 5px; }
  .chip.new { background: var(--good); color: #08261a; } .chip.new b { color: #08261a; }
  .chip.sh { opacity: .55; } .chip.sh b { color: var(--dim); }
  #net { grid-area: net; text-align: center; font-size: 12px; color: var(--dim); min-height: 16px; }
  #toast { position: fixed; left: 50%; top: max(62px, calc(env(safe-area-inset-top) + 56px)); transform: translateX(-50%); background: #0b1226ee; border: 1px solid #ffffff2a; color: #fff; padding: 7px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .25s; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0a1022c4; }
  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 88vh; overflow: auto; padding: 18px 20px; border-radius: 18px; background: #18244a; border: 1px solid #ffffff2a; text-align: center; box-shadow: 0 10px 50px #0008; }
  .card h2 { margin: 0 0 2px; font-size: 26px; }
  .card .sub { margin: 0 0 8px; color: var(--dim); font-size: 13px; }
  .card h3 { margin: 14px 0 6px; font-size: 13px; color: var(--gold); text-align: left; text-transform: uppercase; letter-spacing: .06em; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; }
  .card li { padding: 2px 0; } .card li span { float: right; font-variant-numeric: tabular-nums; font-weight: 800; }
  .card li small { display: block; color: var(--dim); font-size: 12px; }
  .card li.me { color: var(--gold); }
  .card .chips { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-start; }
  .card p { margin: 10px 0 0; font-size: 13px; opacity: .8; }
  button.go { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 12px; background: var(--good); color: #08261a; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  /* phones and tall windows: players in a strip on top, your words under the grid */
  @media (max-width: 720px), (max-aspect-ratio: 4/5) {
    #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr) auto; grid-template-areas: "head" "players" "play" "words" "net"; gap: 8px; }
    #play { height: min(calc(100vw + 50px), 64vh); }
    #side { display: contents; }
    #players { grid-area: players; flex-direction: row; gap: 5px; }
    .pl { flex: 1 1 0; min-width: 0; grid-template-columns: 8px minmax(0, 1fr); padding: 5px 7px; column-gap: 5px; }
    .pl i { width: 8px; height: 8px; grid-row: 1; }
    .pl b { font-size: 12px; } .pl span { grid-row: 2; grid-column: 1 / 3; font-size: 15px; } .pl small { display: none; }
    #words { grid-area: words; }
    header h1 { font-size: 18px; } #clock { font-size: 22px; }
  }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>

  <div id="side"><div id="players"></div><div id="words"></div></div>
  <div id="net">Connecting…</div>
</div>
<div id="toast"></div>
<div id="over" hidden><div class="card">
  <h2 id="winner"></h2><div class="sub" id="winSub"></div><ol id="results"></ol>
  <h3>Your words</h3><div class="chips" id="mine"></div>
  <h3>Nobody found</h3><div class="chips" id="missed"></div>
  <h3>Best rounds</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">Play again</button><p id="next"></p>
</div></div>

<script>
/* ═══ WORD GRID · a Multiplayer Agent starter ═════════════════════════════════════════
 * One shared grid of letters. Drag across touching letters to make words before the clock
 * runs out. Longer words score more; a word someone else found too scores less.
 * Versus, 2–8 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ grid size, round length, points per word length, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   GRID & WORDS .. the letter bag, dealing a grid from a seed, the word check (isWord), the
 *                   solver that finds every word in a grid (bots and "nobody found" use it)
 *   ROUND (HOST) .. the phases (count, play, done), adding up the scores. Only the host writes these.
 *   BOTS .......... each bot's words and the moment it finds each one, worked out from the seed
 *   MY PLAY ....... the word you're dragging or typing, checking it, your found words
 *   DRAW .......... the tiles, the path you drag, the word bubble, effects
 *   HUD & RESULTS . clock, players, your words, toasts, results card, leaderboard
 *   SOUND ......... WebAudio blips (no files)
 *   INPUT ......... drag with the mouse or a finger, or type a word and press Enter
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The round lives in ONE shared field, `round`: {id, v, phase, seed, n, g, ms, startAt,
 *     endsAt, res, sh, miss}. Only the HOST writes it; `v` goes up on every write. `g` is the
 *     grid as one string of letters ("Q" is the Qu tile), so everyone plays the same board.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. It deals the grid, starts and ends the clock (timestamps), then
 *     adds up the scores from everyone's word lists and writes the results. It also writes
 *     `bots` {r, list}: the bot players in this round.
 *   - Bots need no ticking: each bot's words and the time it finds each one come from the
 *     round seed (mulberry32), so every screen works out the same bot progress from the clock,
 *     and a new host carries on without a jump.
 *   - Each player writes its OWN entity: `w` {r, w} (round id and the words it found, as one
 *     string) after every word, `hb` (heartbeat) once a second, `rdy` (Play again) and `n`/`c`
 *     (name, color). No intents: nobody's word changes anyone else's list. (Word lists are
 *     plain state, so a curious player could peek; fine for friends.)
 *   - Scores: every word earns CONFIG.points by length; at the end a word that two or more
 *     players found earns only CONFIG.sharedShare of that. `sh` lists those shared words.
 *   - Someone who arrives mid-round plays the rest of it.
 *   - Live ops: mp.live.config.size (4 or 5) and .roundSecs change the next round.
 *   - ?attract plays offline: bots plus an autopilot for you (the preview video).
 *   - Leaderboard "best-round": each player's best round score.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  size: 4,               // the grid is size × size: 4 or 5 (live ops: config.size)
  roundSecs: 120,        // how long a round lasts (live ops: config.roundSecs)
  countdown: 3500,       // ms of count-in before the tiles flip over
  graceMs: 700,          // the host waits this long after time's up for the last words to arrive
  resultsMs: 16000,      // ms on the results card before the next round
  seats: 4,              // bots fill the room up to this many players
  minLen: 3,             // shortest word allowed
  points: [0, 0, 0, 1, 2, 3, 5, 8, 11], // points by word length (8+ letters score the last one)
  sharedShare: 0.5,      // a word someone else found too scores this share of its points (rounded up)
  gridTries: 40,         // the host deals this many grids from the seed and keeps the richest
  botSkill: [0.2, 0.65], // 0..1: how many words a bot spots, and how quickly
  botGapMs: [11000, 4000], // a bot's average time per word at skill 0 and at skill 1
  volume: 0.4,
  board: "best-round",
};
const BOT_NAMES = ["Lexi", "Wordsworth", "Scribble", "Vowelina", "Inky", "Quill", "Spellbound"];
const COLORS = ["#ff6b8b", "#4cc3ff", "#ffc94d", "#43d18b", "#b98cff", "#ff9a4d", "#3fe0c5", "#ff7ad9"];
const NAME_A = ["Clever", "Quick", "Witty", "Sharp", "Bright", "Lucky"], NAME_B = ["Owl", "Fox", "Quill", "Pencil", "Raven", "Otter"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'word-grid',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true, live: { config: {}, active: [] },
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {}, onLive() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field, parsed once per change (read-only: never mutate what this returns). */
function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} }, netDown = false;
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
const humans = () => livePlayers(); // (in ?attract you play too, on autopilot)
const liveConfig = () => (net && net.live && net.live.config) || {};

// ── GRID & WORDS ────────────────────────────────────────────────────────────────────
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; }
// The letter bag: common letters many times, rare ones once. "Q" is dealt as a "Qu" tile.
const BAG = "EEEEEEEEEEEEAAAAAAAAAIIIIIIIIOOOOOOOOTTTTTTTTTNNNNNNNSSSSSSSSRRRRRRRLLLLLDDDDUUUUCCCHHHMMMPPPGGGBBFFYYWWKVXJQZ";
const DICT = new Set(WORDS);
const pointsFor = (len) => CONFIG.points[Math.min(len, CONFIG.points.length - 1)];
const tileText = (ch) => (ch === "Q" ? "qu" : ch.toLowerCase());
/** A listed word, or a listed word + s / es / ies (cats, boxes, berries). */
function isWord(w) {
  if (w.length < CONFIG.minLen) return false;
  if (DICT.has(w)) return true;
  const plain = (b) => DICT.has(b) && !(b.length > 4 && /(ed|ing)$/.test(b));
  if (w.endsWith("ies") && plain(w.slice(0, -3) + "y")) return true;
  if (w.endsWith("es") && /(s|x|z|ch|sh)$/.test(w.slice(0, -2)) && plain(w.slice(0, -2))) return true;
  return w.endsWith("s") && !/(s|x|z|ch|sh|y)$/.test(w.slice(0, -1)) && plain(w.slice(0, -1)) || (w.endsWith("ys") && plain(w.slice(0, -1)) && /[aeiou]ys$/.test(w));
}
const nbMemo = new Map();
/** For each tile, the tiles touching it (sideways and diagonally). */
function neighbours(n) {
  if (!nbMemo.has(n)) nbMemo.set(n, Array.from({ length: n * n }, (_, i) => {
    const out = [], r = Math.floor(i / n), c = i % n;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) if ((dr || dc) && r + dr >= 0 && r + dr < n && c + dc >= 0 && c + dc < n) out.push((r + dr) * n + c + dc);
    return out;
  }));
  return nbMemo.get(n);
}
const adjacent = (a, b, n) => a !== b && Math.abs(Math.floor(a / n) - Math.floor(b / n)) <= 1 && Math.abs((a % n) - (b % n)) <= 1;
const TRIE = (() => { const root = {}; for (const w of WORDS) { let node = root; for (const ch of w) node = node[ch] || (node[ch] = {}); node.$ = 1; } return root; })();
const solveMemo = new Map();
/** Every listed word in a grid, with one path that spells it: Map word -> [tile indexes]. */
function solve(g, n) {
  if (solveMemo.has(g)) return solveMemo.get(g);
  const found = new Map(), used = new Uint8Array(n * n), path = [], nb = neighbours(n);
  const walk = (i, node, word) => {
    const t = tileText(g[i]);
    for (const ch of t) { node = node[ch]; if (!node) return; }
    word += t; used[i] = 1; path.push(i);
    if (node.$ && word.length >= CONFIG.minLen && !found.has(word)) found.set(word, path.slice());
    for (const j of nb[i]) if (!used[j]) walk(j, node, word);
    used[i] = 0; path.pop();
  };
  for (let i = 0; i < n * n; i++) walk(i, TRIE, "");
  if (solveMemo.size > 40) solveMemo.clear();
  solveMemo.set(g, found);
  return found;
}
/** Deal a grid from a seed: several tries, keep the one with the most points to find. */
function makeGrid(seed, n) {
  const rnd = mulberry32(seed);
  let best = "", bestScore = -1;
  for (let t = 0; t < CONFIG.gridTries || !best; t++) {
    let g = "";
    for (let i = 0; i < n * n; i++) g += BAG[Math.floor(rnd() * BAG.length)];
    const vowels = (g.match(/[AEIOU]/g) || []).length, counts = {};
    for (const ch of g) counts[ch] = (counts[ch] || 0) + 1;
    const lumpy = Object.entries(counts).some(([ch, k]) => k > (/[AEIOS]/.test(ch) ? 3 : 2)) || (counts.Q && !/[AEIO]/.test(g));
    if (best && (vowels < n * n * 0.3 || vowels > n * n * 0.5 || lumpy)) continue;
    let score = 0;
    for (const w of solve(g, n).keys()) score += pointsFor(w.length);
    if (score > bestScore) { best = g; bestScore = score; }
  }
  return best;
}
/** A path of touching tiles that spells `word` (typing), or null. A lone "q" at the end matches the Qu tile. */
function findPath(g, n, word) {
  const used = new Uint8Array(n * n), path = [], nb = neighbours(n);
  const go = (i, rest) => {
    const t = tileText(g[i]);
    if (!rest.startsWith(t) && !(t === "qu" && rest === "q")) return false;
    used[i] = 1; path.push(i);
    const left = rest.slice(t.length);
    if (!left) return true;
    for (const j of nb[i]) if (!used[j] && go(j, left)) return true;
    used[i] = 0; path.pop();
    return false;
  };
  for (let i = 0; i < n * n; i++) if (go(i, word)) return path;
  return null;
}
const wordOf = (r, path) => path.map((i) => tileText(r.g[i])).join("");

// ── ROUND (HOST) ────────────────────────────────────────────────────────────────────
const host = { last: null, wasHost: false, bots: [], roundId: 0, lastBots: 0, botsJson: "" };
/** The round as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function round() {
  const r = cached("round", S.shared.round, null);
  return host.last && isHost() && (!r || host.last.v > r.v) ? host.last : r;
}
function writeRound(r) { r = { ...r, v: (round()?.v ?? 0) + 1 }; host.last = r; net.setShared("round", JSON.stringify(r)); return r; }
function newRound(id) {
  const n = Math.max(4, Math.min(5, Math.round(+liveConfig().size || CONFIG.size)));
  const secs = Math.max(20, Math.min(600, +liveConfig().roundSecs || CONFIG.roundSecs));
  const seed = (Math.random() * 1e9) | 0;
  return { id, phase: "count", seed, n, g: makeGrid(seed, n), ms: secs * 1000, startAt: Date.now() + CONFIG.countdown, endsAt: 0, res: [], sh: [], miss: [] };
}
const playEnd = (r) => r.startAt + r.ms;
/** Become host: take over the bots exactly as state has them. */
function adopt() {
  host.wasHost = true;
  const r = round(), b = cached("bots", S.shared.bots, null);
  host.roundId = r ? r.id : 0;
  host.bots = r && b && b.r === r.id && Array.isArray(b.list) ? b.list.map((x) => ({ ...x })) : [];
}
function fillBots() {
  const want = Math.max(0, CONFIG.seats - humans().length);
  if (host.bots.length > want) host.bots.length = want;
  const taken = new Set([...Object.values(S.entities.players || {}).map((p) => p.c), myColor]);
  while (host.bots.length < want) {
    const names = new Set(host.bots.map((b) => b.n)), colors = new Set([...taken, ...host.bots.map((b) => b.c)]), [lo, hi] = CONFIG.botSkill;
    const k = Math.round((lo + ((hi - lo) * (host.bots.length + Math.random() * 0.9)) / Math.max(1, want)) * 100) / 100;
    host.bots.push({ i: "bot" + host.bots.length, n: BOT_NAMES.find((x) => !names.has(x)) || "Bot", c: COLORS.find((x) => !colors.has(x)) || "#ccc", k });
  }
}
/** Add up the round: every word scores by length; words two or more players found score less. */
function tally(r) {
  const list = players(r), count = new Map();
  for (const p of list) for (const w of new Set(p.words)) count.set(w, (count.get(w) || 0) + 1);
  const scoreOf = (w) => (count.get(w) > 1 ? Math.ceil(pointsFor(w.length) * CONFIG.sharedShare) : pointsFor(w.length));
  const res = list.map((p) => [p.id, String(p.name).slice(0, 14), p.color, p.words.reduce((s, w) => s + scoreOf(w), 0), p.words.length, p.words.reduce((a, w) => (w.length > a.length ? w : a), ""), p.pts])
    .sort((a, b) => b[3] - a[3] || b[4] - a[4]).slice(0, 8);
  const sh = [], miss = [];
  for (const w of [...count].filter(([, c]) => c > 1).map(([w]) => w).sort((a, b) => b.length - a.length)) if (sh.join(" ").length + w.length < 700) sh.push(w);
  for (const w of [...solve(r.g, r.n).keys()].filter((w) => !count.has(w)).sort((a, b) => b.length - a.length || (a < b ? -1 : 1))) if (miss.length < 8) miss.push(w);
  return { ...r, phase: "done", endsAt: Date.now() + CONFIG.resultsMs, res, sh, miss };
}
function hostTick(now) {
  if (!host.wasHost) adopt();
  let r = round();
  const t = Date.now();
  if (!r) r = writeRound(newRound(1));
  if (host.roundId !== r.id) { host.roundId = r.id; host.bots = []; } // a new round: fresh bots
  if (r.phase === "count") {
    fillBots(); // seats can still change during the count-in
    if (t >= r.startAt) r = writeRound({ ...r, phase: "play" });
  } else if (r.phase === "play") {
    if (t >= playEnd(r) + CONFIG.graceMs) r = writeRound(tally(r));
  } else if (r.phase === "done") {
    const people = humans(), ready = people.length && people.every((id) => (id === net.sessionId ? me.ready : (S.entities.players[id] || {}).rdy) === r.id);
    if (t > r.endsAt || ready) r = writeRound(newRound(r.id + 1));
  }
  const json = JSON.stringify({ r: r.id, list: host.bots });
  if (json !== host.botsJson || now - host.lastBots > 3000) { host.botsJson = json; host.lastBots = now; net.setShared("bots", json); }
}

// ── BOTS ────────────────────────────────────────────────────────────────────────────
const planMemo = new Map();
/** A bot's words in this round and when it finds each (ms after the start), from the seed. Same on every screen. */
function botPlan(r, b) {
  const key = `${r.id}:${r.seed}:${r.g}:${b.i}:${b.k}`;
  if (planMemo.has(key)) return planMemo.get(key);
  const rnd = mulberry32(r.seed ^ hashStr(b.i)), words = [...solve(r.g, r.n).keys()].sort();
  const spot = (w) => [1, 1, 1, 0.9, 0.75, 0.5, 0.32, 0.18, 0.1][Math.min(w.length, 8)] * (0.4 + b.k * 0.6); // long words are harder to see
  const known = words.filter((w) => rnd() < spot(w)).map((w) => ({ w, o: w.length * 0.7 + rnd() * 3.5 })).sort((x, y) => x.o - y.o);
  const [g0, g1] = CONFIG.botGapMs, gap = g0 + (g1 - g0) * b.k;
  let at = 800 + rnd() * 2000;
  const plan = known.map(({ w }) => { at += gap * (0.35 + rnd() * 1.3) * (0.45 + w.length * 0.1); return { w, at: Math.round(at) }; });
  if (planMemo.size > 60) planMemo.clear();
  planMemo.set(key, plan);
  return plan;
}
function botList(r) {
  if (isHost()) return host.bots;
  const b = cached("bots", S.shared.bots, null);
  return b && b.r === r.id && Array.isArray(b.list) ? b.list : [];
}
const botColors = () => { const r = round(); return r ? botList(r).map((b) => b.c) : []; };
/** Everyone in this round: { id, name, color, words, pts (before sharing), mine, bot }, most points first. */
function players(r) {
  const out = [], cut = Math.min(Date.now(), playEnd(r)) - r.startAt;
  for (const id of humans()) {
    if (id === net.sessionId) { out.push({ id, name: myName, color: myColor, words: me.roundId === r.id ? me.words : [], mine: true }); continue; }
    const p = S.entities.players[id] || {}, w = cached("w:" + id, p.w, null);
    out.push({ id, name: String(p.n || "Player"), color: p.c || "#ccc", words: w && w.r === r.id && typeof w.w === "string" && w.w ? w.w.split(" ") : [] });
  }
  for (const b of botList(r)) out.push({ id: b.i, name: b.n, color: b.c, bot: true, words: r.phase === "count" ? [] : botPlan(r, b).filter((x) => x.at <= cut).map((x) => x.w) });
  for (const x of out) x.pts = x.words.reduce((s, w) => s + pointsFor(w.length), 0);
  return out.sort((a, b) => b.pts - a.pts || b.words.length - a.words.length);
}

// ── MY PLAY ─────────────────────────────────────────────────────────────────────────

const local = (e) => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  const r = round(); if (!canPlay(r) || drag) return;
  const [x, y] = local(e), G = geo(r.n), i = tileAt(x, y, G, 0.55);
  if (i < 0) return;
  try { cv.setPointerCapture(e.pointerId); } catch {}
  drag = { id: e.pointerId, x, y }; me.typed = ""; me.path = [i]; sfx("tick", 1);
});
cv.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const r = round(); if (!canPlay(r)) return;
  const [x, y] = local(e), G = geo(r.n), steps = Math.max(1, Math.ceil(Math.hypot(x - drag.x, y - drag.y) / (G.cell * 0.12)));
  for (let s = 1; s <= steps; s++) reach(tileAt(drag.x + ((x - drag.x) * s) / steps, drag.y + ((y - drag.y) * s) / steps, G, 0.4), r); // fast swipes: check the whole way
  drag.x = x; drag.y = y;
});
function endDrag(e) { if (!drag || e.pointerId !== drag.id) return; drag = null; const path = me.path; me.path = []; submit(path); }
cv.addEventListener("pointerup", endDrag); cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("contextmenu", (e) => e.preventDefault());
// Typing (desktop): letters light up a path on the grid, Enter checks it, Backspace and Esc fix it.
addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  unlockAudio();
  const r = round();
  if (r && r.phase === "done" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); playAgain(); return; }
  if (!canPlay(r) || drag) return;
  if (/^[a-z]$/i.test(e.key)) { me.typed = (me.typed + e.key.toLowerCase()).slice(0, 16); sfx("tick", me.typed.length); }
  else if (e.key === "Backspace") me.typed = me.typed.slice(0, -1);
  else if (e.key === "Escape") me.typed = "";
  else if (e.key === "Enter") {
    e.preventDefault();
    if (me.typed) { const path = findPath(r.g, r.n, me.typed); if (path) submit(path); else feedback("nopath", me.typed, []); }
    me.typed = ""; me.path = []; return;
  } else return;
  me.path = me.typed ? findPath(r.g, r.n, me.typed) || [] : [];
});
document.addEventListener("touchmove", (e) => { if (e.target === cv) e.preventDefault(); }, { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(now); else host.wasHost = false;
  const r = round();
  if (r) {
    if (r.phase !== "done" && me.roundId !== r.id) joinRound(r); // a new round, or you just arrived: line up
    if (r.phase !== "play" || Date.now() >= playEnd(r)) { if (me.path.length && !drag) me.path = []; me.typed = ""; }
    autopilot(r, now);
    beeps(r);
    draw(r, now, dt);
    if (now - lastHud > 100) { lastHud = now; hud(r); }
  } else { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H); }
}
/** Count-in beeps, GO, and the bell at time's up. */
function beeps(r) {
  const t = Date.now() - r.startAt, k = t < 0 ? Math.ceil(-t / 1000) : Date.now() < playEnd(r) ? 0 : -1;
  if (k !== me.lastBeep) { if (k > 0 && k <= 3) sfx("beep"); else if (k === 0 && me.lastBeep > 0) sfx("go"); else if (k === -1 && me.lastBeep === 0) sfx("end"); me.lastBeep = k; }
}
/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = botColors();
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !bots.includes(myColor)) return; // a bot in your color: you change
  const taken = new Set([...others.map(([, p]) => p.c), ...bots]), free = COLORS.find((c) => !taken.has(c));
  if (free) { myColor = free; net.me.set("c", free); }
}

(async function start() {
  fit();
  net = await connect();
  net.onState((st) => { S = st; });
  net.onDisconnect(() => { netDown = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { netDown = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...botColors()]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { roundSecs: 45, countdown: 900, resultsMs: 3000, botSkill: [0.6, 0.95], botGapMs: [4200, 2200] });
  requestAnimationFrame(frame);
})();
</script>
